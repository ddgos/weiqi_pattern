[package]
name = "weiqi_pattern"
version = "0.3.0"
edition = "2024"

[dependencies]
vec2d = "0.4.1"
tiny_goban = { git = "https://github.com/ddgos/tiny_goban", version = "0.3.2", optional = true }
sgf-parse = { version = "4.2.8", optional = true }
clap = { version = "4.5.54", features = ["derive"], optional = true }
clap-stdin = { version = "0.8.0", optional = true }
anyhow = { version = "1.0.100", optional = true }
serde = { version = "1.0.228", default-features = false, features = ["derive", "serde_derive"], optional = true }

[features]
serde = [ "dep:serde", "vec2d/serde_support" ]
from_sgf = [ "dep:tiny_goban", "dep:sgf-parse" ]
from_sgf_cli = [ "from_sgf", "dep:clap", "dep:clap-stdin", "dep:anyhow" ]

[[bin]]
name = "sgf_to_patterns"
required-features = [ "from_sgf_cli" ]
